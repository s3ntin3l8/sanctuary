name: Docker Build

# docker-publish.yml only builds after a merge to main. This builds the image on
# the PR itself whenever something it depends on changes, so a base-image or
# requirements bump (typically a Dependabot PR) that cannot be built is caught
# before it lands. The Python job in ci.yml never builds the Dockerfile.
on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - requirements.txt
      # Stage 1 of the Dockerfile runs `npm ci` + `npm run build` on these.
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/docker-build.yml

# A new push to the same PR supersedes the build in flight.
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Cold build installs torch/docling: ~3-8 min.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Log in to Docker Hub
        # Avoids the anonymous pull rate limit; anonymous when the secrets are unset
        # (Dependabot PRs get no repo secrets).
        uses: s3ntin3l8/.github/.github/actions/dockerhub-login@main
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          token: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build the image (not pushed)
        # The py-builder stage's prune step and import check fail the build when a
        # dependency or base-image change breaks them; the runtime stage covers the
        # apt packages.
        # COMMIT_SHA and COMMIT_DATE are what the shared docker-publish workflow passes
        # (the commit it checked out); the checks below fail if the Dockerfile's
        # ARG -> ENV mapping to SANCTUARY_GIT_SHA / SANCTUARY_BUILD_DATE breaks,
        # which would otherwise ship "unknown" silently.
        run: |
          sha=$(git rev-parse HEAD)
          commit_date=$(git show -s --format=%cI HEAD)
          docker build --build-arg SANCTUARY_VERSION=ci --build-arg "COMMIT_SHA=${sha}" --build-arg "COMMIT_DATE=${commit_date}" -t sanctuary-ci-build .
          env_of() {
            docker image inspect sanctuary-ci-build --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n "s/^$1=//p"
          }
          stamped=$(env_of SANCTUARY_GIT_SHA)
          if [ "$stamped" != "$sha" ]; then
            echo "::error::SANCTUARY_GIT_SHA in the image is '${stamped}', expected ${sha} (Dockerfile ARG COMMIT_SHA -> ENV mapping)"
            exit 1
          fi
          stamped_date=$(env_of SANCTUARY_BUILD_DATE)
          if [ "$stamped_date" != "$commit_date" ]; then
            echo "::error::SANCTUARY_BUILD_DATE in the image is '${stamped_date}', expected ${commit_date} (Dockerfile ARG COMMIT_DATE -> ENV mapping)"
            exit 1
          fi
