name: Visual refresh

# Weekly: regenerate the README screenshots, loop and landing stills (`make screenshots`) and, only when an image
# changed by more than the pixel tolerance, open or update one rolling pull request from
# `bot/refresh-screenshots`. The `baselines` job does the same for the committed visual baselines
# (`make visual-baseline`, PR from `bot/refresh-baselines`): the safety net for a UI PR that moved a baseline scene
# and forgot `/update-baselines`. The mechanics, the tolerance and the self-approval of the PR's held checks live in
# the shared workflow in s3ntin3l8/.github (visual-refresh.yml); `workflow_dispatch` runs both on demand.
#
# `paths` is a git pathspec: `docs/screenshots/*.png` leaves out `case-views.{webm,mp4,jpg}`, the loop the readme
# profile re-encodes on every run. The shared workflow refuses any changed file that is not a PNG (or JSON, with
# `allow-json`), and a loop is never byte-identical, so listing the folder would fail the job on its first real
# change. The loop is not shown in the README; regenerate it by hand with `make screenshots` when it is wanted.
# The shared workflow shell-globs `paths`, so a PNG that was deleted or renamed is no longer reported by this job:
# after renaming or removing a scene, delete its old PNG in `docs/screenshots` by hand.
# Both jobs use the shared tolerance (`max-diff-pixels: 20`): a re-render within 20 px keeps the committed image.
on:
  schedule:
    - cron: "47 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  refresh:
    if: ${{ !github.event.repository.fork }}
    uses: s3ntin3l8/.github/.github/workflows/visual-refresh.yml@main
    with:
      python-version: "3.14"
      node-version: "26"
      paths: "docs/screenshots/*.png"
      title: "chore(ui): refresh screenshots"

  # After the screenshots job, never beside it: the shared workflow runs one refresh at a time per repo, and a
  # third queued run would be dropped. `!cancelled()` so a failed screenshots refresh does not skip this one.
  # A dispatch landing while the Monday run holds that group can drop this queued job (one pending run per
  # group): it simply retries next Monday, or dispatch again. The shared workflow refuses any changed file that is
  # not PNG or JSON, so a non-constant stamp in visual/baselines/.visual-kit would fail this job.
  baselines:
    needs: refresh
    if: ${{ !cancelled() && !github.event.repository.fork }}
    uses: s3ntin3l8/.github/.github/workflows/visual-refresh.yml@main
    with:
      python-version: "3.14"
      node-version: "26"
      target: visual-baseline
      paths: visual/baselines
      branch: bot/refresh-baselines
      title: "chore(ui): refresh visual baselines"
      allow-json: true
