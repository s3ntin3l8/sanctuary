version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns:
          - "*"
        # Bundle only minor/patch in the weekly group. Major bumps still get
        # their own individual PRs (reviewable/testable) — the all-in-one major
        # bundle was perpetually unmergeable against the pinned framework stack.
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Held framework majors — adopt deliberately with tests, not automatically.
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "torchvision"
        update-types: ["version-update:semver-major"]
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
      # Transitive deps capped by held frameworks: docling-core pins
      # typer<0.25.0 — let the framework drive it. (tokenizers and
      # huggingface-hub follow transformers 5.x's own caps, so they are no
      # longer ignored; an ignored tokenizers blocks transformers bumps.)
      - dependency-name: "typer"
      # docling-slim[standard] caps websockets<17.0 — the major moves with docling.
      - dependency-name: "websockets"
        update-types: ["version-update:semver-major"]
      # docling-core's chunking extras pin semchunk<4.0.0 — same pattern.
      - dependency-name: "semchunk"
        update-types: ["version-update:semver-major"]
      # docling is the ingestion engine — upgrade the family in lockstep, by hand.
      - dependency-name: "docling*"
      # pyobjc is a darwin-only OCR dependency family (core + Cocoa/CoreML/Quartz/
      # Vision) that must move in lockstep; an individual major PR desyncs it.
      # The minor/patch group keeps them aligned — only block the majors.
      - dependency-name: "pyobjc*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-images:
        patterns:
          - "*"
